<style>
.page__title { display: none; }
.page {
  float: none !important;
  width: 100% !important;
  padding-right: 0 !important;
}
.page__inner-wrap {
  max-width: 1120px;
  margin: 0 auto;
}
.cv-shell {
  --ink: #171717;
  --muted: #66645f;
  --line: #dedbd3;
  --accent: #315fe8;
  max-width: 1120px;
  margin: 0 auto;
  color: var(--ink);
}
.cv-intro {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: 1.5rem;
  padding: 1.2rem 0 1.45rem;
  border-bottom: 1px solid var(--line);
}
.cv-kicker {
  margin-bottom: .45rem;
  color: var(--accent);
  font-size: .76rem;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.cv-intro h1 {
  margin: 0;
  font-size: clamp(2rem, 5vw, 4rem);
  line-height: 1.02;
}
.cv-demo-link {
  color: var(--ink) !important;
  font-size: .9rem;
  font-weight: 750;
  text-decoration: none !important;
  white-space: nowrap;
}
.cv-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: .7rem;
  padding: 1rem 0;
}
.cv-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 2.4rem;
  padding: .55rem .9rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--ink) !important;
  font-size: .82rem;
  font-weight: 750;
  text-decoration: none !important;
}
.cv-button.primary {
  border-color: var(--ink);
  background: var(--ink);
  color: white !important;
}
.cv-frame {
  display: block;
  width: 100%;
  height: min(82vh, 1120px);
  min-height: 720px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #f4f3ef;
}
@media (max-width: 820px) {
  .cv-intro { grid-template-columns: 1fr; }
  .cv-demo-link { justify-self: start; }
  .cv-frame { min-height: 620px; }
}
</style>

<div class="cv-shell">
  <header class="cv-intro">
    <div>
      <div class="cv-kicker">Curriculum Vitae</div>
      <h1>毛晔昕 · CV</h1>
    </div>
    <a class="cv-demo-link" href="/demos/">项目视频演示 →</a>
  </header>

  <div class="cv-toolbar">
    <a class="cv-button primary" href="/files/Yexin_Mao_Resume.pdf" target="_blank" rel="noopener">打开 PDF</a>
    <a class="cv-button" href="/files/Yexin_Mao_Resume.pdf" download>下载 PDF</a>
  </div>

  <object class="cv-frame" data="/files/Yexin_Mao_Resume.pdf#view=FitH" type="application/pdf">
    <p>当前浏览器无法内嵌显示 PDF。<a href="/files/Yexin_Mao_Resume.pdf">点击这里打开简历</a>。</p>
  </object>
</div>
